name: LAQTA Hourly Pulse

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/laqta-pulse.yml"

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Wake LAQTA and publish if due
        run: |
          curl -fsS --retry 3 --retry-delay 10 -X POST https://laqta-control-center.onrender.com/api/pulse
