name: LAQTA Force Publish Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/laqta-force-once.yml"

jobs:
  force:
    runs-on: ubuntu-latest
    steps:
      - name: Force one verified publish now
        run: |
          curl -fsS --retry 5 --retry-delay 8 https://laqta-control-center.onrender.com/api/force-publish-8c21f
