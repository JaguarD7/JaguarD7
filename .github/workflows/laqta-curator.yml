name: LAQTA Deal Curator

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/laqta-curator.yml"
      - "laqta-control-center/curate_offers.py"

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: laqta-feed
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh curated offers
        run: python laqta-control-center/curate_offers.py
      - name: Commit refreshed feed
        run: |
          git config user.name "LAQTA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add laqta-control-center/curated_offers.json
          git diff --cached --quiet || git commit -m "Refresh LAQTA curated offers"
          git push origin HEAD:laqta-feed
