name: Build Rose Portable RPF Engine
on:
  push:
    branches: [rose-rpf-engine]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Rose branch
        uses: actions/checkout@v4
        with:
          ref: rose-rpf-engine

      - name: Checkout CodeWalkerProjects
        uses: actions/checkout@v4
        with:
          repository: crxhvrd/CodeWalkerProjects
          ref: master
          path: cw

      - name: Patch Rose GTA path handoff for mods-folder install
        shell: pwsh
        run: |
          $cli = "cw/CodeWalker.OIVInstaller/Cli/Program.cs"
          $c = Get-Content $cli -Raw
          $oldCli = 'string gameFolder = OivAppConfig.Load().LastGameFolder; // Use default if set'
          $newCli = 'string gameFolder = Environment.GetEnvironmentVariable("ROSE_GTA_PATH") ?? OivAppConfig.Load().LastGameFolder; // Rose env handoff avoids Windows command-line quoting/path issues'
          if (-not $c.Contains($oldCli)) { throw "Expected gameFolder line not found" }
          $c = $c.Replace($oldCli,$newCli)
          Set-Content -Path $cli -Value $c -Encoding UTF8

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish framework-dependent engine
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force portable -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path portable/engine,portable/runtime,portable/packer | Out-Null
          dotnet publish cw/CodeWalker.OIVInstaller/CodeWalker.OIVInstaller.csproj -c Release -r win-x64 --self-contained false -o portable/engine
          if (!(Test-Path "portable/engine/CodeWalker.OIVInstaller.dll")) { throw "Engine build missing" }
          dotnet publish rose-packer/RoseRpfPacker.csproj -c Release -r win-x64 --self-contained false -o portable/packer
          if (!(Test-Path "portable/packer/RoseRpfPacker.dll")) { throw "RoseRpfPacker build missing" }

      - name: Validate FiveM RPF package format
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force rpf-test -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path rpf-test/src/content | Out-Null
          @'
<?xml version="1.0" encoding="UTF-8"?>
<package version="2.2" id="{1A53DC0B-6CD4-4E3C-A80C-3BC193B06711}" target="Five">
  <metadata>
    <name>Rose Package Format Test</name>
    <version><major>1</major><minor>0</minor></version>
    <author><displayName>Rose</displayName></author>
    <description><![CDATA[Test]]></description>
  </metadata>
  <colors><headerBackground useBlackTextColor="False">$FF202020</headerBackground><iconBackground>$FF555555</iconBackground></colors>
  <content></content>
</package>
'@ | Set-Content -Path rpf-test/src/assembly.xml -Encoding UTF8
          'test' | Set-Content -Path rpf-test/src/content/test.txt -Encoding UTF8
          dotnet portable/packer/RoseRpfPacker.dll rpf-test/src rpf-test/Rose_Test.rpf
          if ($LASTEXITCODE -ne 0) { throw "RoseRpfPacker format test failed" }
          $head = [IO.File]::ReadAllBytes("$PWD\rpf-test\Rose_Test.rpf")[0..3]
          if ([Text.Encoding]::ASCII.GetString($head) -ne 'RPF7') { throw "Rose RPF header is not RPF7" }

          $fiveMApp = Join-Path $env:LOCALAPPDATA 'FiveM\FiveM.app'
          New-Item -ItemType Directory -Force -Path $fiveMApp | Out-Null
          dotnet portable/engine/CodeWalker.OIVInstaller.dll --install "$PWD\rpf-test\Rose_Test.rpf"
          if ($LASTEXITCODE -ne 0) { throw "CodeWalker did not accept Rose FiveM RPF package" }
          if (!(Test-Path (Join-Path $fiveMApp 'mods\Rose_Test.rpf'))) { throw "FiveM mods package copy validation failed" }

      - name: Download portable .NET 8 runtimes
        shell: pwsh
        run: |
          $coreZip = Join-Path $PWD 'dotnet-runtime-8.0.31-win-x64.zip'
          $desktopZip = Join-Path $PWD 'windowsdesktop-runtime-8.0.31-win-x64.zip'
          Invoke-WebRequest -Uri 'https://builds.dotnet.microsoft.com/dotnet/Runtime/8.0.31/dotnet-runtime-8.0.31-win-x64.zip' -OutFile $coreZip
          Invoke-WebRequest -Uri 'https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/8.0.31/windowsdesktop-runtime-8.0.31-win-x64.zip' -OutFile $desktopZip
          Expand-Archive -LiteralPath $coreZip -DestinationPath "$PWD\portable\runtime" -Force
          Expand-Archive -LiteralPath $desktopZip -DestinationPath "$PWD\portable\runtime" -Force
          Remove-Item $coreZip,$desktopZip -Force
          if (!(Test-Path "$PWD\portable\runtime\dotnet.exe")) { throw "Portable dotnet.exe missing after runtime extraction" }
          & "$PWD\portable\runtime\dotnet.exe" --list-runtimes
          $listed = (& "$PWD\portable\runtime\dotnet.exe" --list-runtimes | Out-String)
          if ($listed -notmatch 'Microsoft\.NETCore\.App 8\.0\.31') { throw "Core runtime 8.0.31 missing" }
          if ($listed -notmatch 'Microsoft\.WindowsDesktop\.App 8\.0\.31') { throw "Desktop runtime 8.0.31 missing" }

      - name: Pack portable bundle
        shell: pwsh
        run: |
          Copy-Item cw/Notice.txt portable/engine/CodeWalker-Notice.txt
          Remove-Item releases/Rose_FiveM_PackageTools_v111_win-x64.zip -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path releases | Out-Null
          Compress-Archive -Path portable/* -DestinationPath releases/Rose_FiveM_PackageTools_v111_win-x64.zip -CompressionLevel Optimal -Force
          $zip = Get-Item releases/Rose_FiveM_PackageTools_v111_win-x64.zip
          Write-Host "ZIP bytes: $($zip.Length)"
          if ($zip.Length -gt 99000000) { throw "Portable ZIP exceeds GitHub 100MB file limit" }
          Get-FileHash releases/Rose_FiveM_PackageTools_v111_win-x64.zip -Algorithm SHA256 | Format-List

      - name: Commit portable bundle
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/Rose_FiveM_PackageTools_v111_win-x64.zip
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Build Rose FiveM package tools v111 [skip ci]"
          git pull --rebase origin rose-rpf-engine
          git push origin HEAD:rose-rpf-engine
