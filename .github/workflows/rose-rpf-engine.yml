name: Build Rose Portable RPF Engine
on:
  push:
    branches: [rose-rpf-engine]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Rose branch
        uses: actions/checkout@v4
        with:
          ref: rose-rpf-engine

      - name: Checkout CodeWalkerProjects
        uses: actions/checkout@v4
        with:
          repository: crxhvrd/CodeWalkerProjects
          ref: master
          path: cw

      - name: Patch direct-game RPF mode
        shell: pwsh
        run: |
          $p = "cw/CodeWalker.OIVInstaller/Engine/OivInstaller.cs"
          $t = Get-Content $p -Raw
          $old = 'public string ModsFolder => Path.Combine(GameFolder, "mods");'
          $new = 'public string ModsFolder => GameFolder;'
          if (-not $t.Contains($old)) { throw "Expected ModsFolder line not found" }
          $t = $t.Replace($old,$new)
          Set-Content -Path $p -Value $t -Encoding UTF8

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish framework-dependent engine
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force portable -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path portable/engine,portable/runtime | Out-Null
          dotnet publish cw/CodeWalker.OIVInstaller/CodeWalker.OIVInstaller.csproj -c Release -r win-x64 --self-contained false -o portable/engine
          if (!(Test-Path "portable/engine/CodeWalker.OIVInstaller.dll")) { throw "Engine build missing" }

      - name: Download portable .NET 8 runtimes
        shell: pwsh
        run: |
          $coreZip = Join-Path $PWD 'dotnet-runtime-8.0.31-win-x64.zip'
          $desktopZip = Join-Path $PWD 'windowsdesktop-runtime-8.0.31-win-x64.zip'
          Invoke-WebRequest -Uri 'https://builds.dotnet.microsoft.com/dotnet/Runtime/8.0.31/dotnet-runtime-8.0.31-win-x64.zip' -OutFile $coreZip
          Invoke-WebRequest -Uri 'https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/8.0.31/windowsdesktop-runtime-8.0.31-win-x64.zip' -OutFile $desktopZip
          Expand-Archive -LiteralPath $coreZip -DestinationPath "$PWD\portable\runtime" -Force
          Expand-Archive -LiteralPath $desktopZip -DestinationPath "$PWD\portable\runtime" -Force
          Remove-Item $coreZip,$desktopZip -Force
          if (!(Test-Path "$PWD\portable\runtime\dotnet.exe")) { throw "Portable dotnet.exe missing after runtime extraction" }
          & "$PWD\portable\runtime\dotnet.exe" --list-runtimes
          $listed = (& "$PWD\portable\runtime\dotnet.exe" --list-runtimes | Out-String)
          if ($listed -notmatch 'Microsoft\.NETCore\.App 8\.0\.31') { throw "Core runtime 8.0.31 missing" }
          if ($listed -notmatch 'Microsoft\.WindowsDesktop\.App 8\.0\.31') { throw "Desktop runtime 8.0.31 missing" }

      - name: Pack portable bundle
        shell: pwsh
        run: |
          Copy-Item cw/Notice.txt portable/engine/CodeWalker-Notice.txt
          Remove-Item releases/Rose_DirectRPF_Portable_win-x64.zip -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path releases | Out-Null
          Compress-Archive -Path portable/* -DestinationPath releases/Rose_DirectRPF_Portable_win-x64.zip -CompressionLevel Optimal -Force
          $zip = Get-Item releases/Rose_DirectRPF_Portable_win-x64.zip
          Write-Host "ZIP bytes: $($zip.Length)"
          if ($zip.Length -gt 99000000) { throw "Portable ZIP exceeds GitHub 100MB file limit" }
          Get-FileHash releases/Rose_DirectRPF_Portable_win-x64.zip -Algorithm SHA256 | Format-List

      - name: Commit portable bundle
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/Rose_DirectRPF_Portable_win-x64.zip
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Build Rose portable RPF engine [skip ci]"
          git pull --rebase origin rose-rpf-engine
          git push origin HEAD:rose-rpf-engine
