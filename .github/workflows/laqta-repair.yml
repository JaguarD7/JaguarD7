name: LAQTA One-Time Repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/laqta-repair.yml"
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Remove invalid Noon posts
        run: |
          curl -fsS --retry 12 --retry-all-errors --retry-delay 10 -X POST https://laqta-control-center.onrender.com/api/repair-noon-9c7e13
