name: LAQTA Buffer Diagnostic Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/laqta-buffer-diag-once.yml"

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Check Buffer delivery
        run: |
          curl -fsS --retry 5 --retry-delay 8 https://laqta-control-center.onrender.com/api/buffer-diagnostic-4e91
